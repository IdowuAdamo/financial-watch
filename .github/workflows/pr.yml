name: PR Validation & Security Checks

on:
  pull_request:
    branches: [main]

jobs:
  backend-checks:
    name: Backend Lint, Test & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: uv sync --frozen

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Start PostgreSQL with pgvector for testing
        run: |
          docker run -d --name test-pgvector \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=financial_watch \
            -p 5433:5432 \
            pgvector/pgvector:pg16
          sleep 3

      - name: Run Pytest Test Suite
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/financial_watch
          API_ACCESS_KEY: fw-test-access-key-2026
          DISABLE_KB_RETRIEVAL: "false"
        run: uv run pytest --maxfail=1 -v

  frontend-checks:
    name: Frontend Lint, Type Check & Static Export
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install NPM Dependencies
        run: npm ci

      - name: Type Check & Static Export Build
        run: npm run build

  terraform-security-and-validation:
    name: Terraform Format, Security Scan & Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.4"

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Init (backend false)
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: Run Trivy IaC Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "config"
          hide-progress: false
          format: "table"
          exit-code: "0" # Audit report in PR
          severity: "CRITICAL,HIGH"
