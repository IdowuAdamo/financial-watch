name: Deploy to AWS Production

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: financial-watch-backend

permissions:
  id-token: write # Required for GitHub Actions OIDC federation
  contents: read

jobs:
  build-and-push-container:
    name: Build, Scan & Push Backend ECR Image
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.build-image.outputs.image }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: FinancialWatchDeploySession

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Tag Docker Image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build -t "$IMAGE_URI" -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" .
          echo "image=$IMAGE_URI" >> $GITHUB_OUTPUT

      - name: Run Trivy Container Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.build-image.outputs.image }}
          format: "table"
          exit-code: "0" # Non-blocking advisory report
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Push Image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

  terraform-apply:
    name: Terraform Apply Infrastructure
    needs: build-and-push-container
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    outputs:
      app_url: ${{ steps.tf-outputs.outputs.app_url }}
      cloudfront_id: ${{ steps.tf-outputs.outputs.cloudfront_id }}
      s3_bucket: ${{ steps.tf-outputs.outputs.s3_bucket }}
      ecs_cluster: ${{ steps.tf-outputs.outputs.ecs_cluster }}
      ecs_service: ${{ steps.tf-outputs.outputs.ecs_service }}
      api_access_key: ${{ steps.tf-outputs.outputs.api_access_key }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.4"

      - name: Clean Orphaned Resources (Initial Bootstrap Only)
        working-directory: .
        run: |
          chmod +x .github/scripts/cleanup_orphans.sh
          .github/scripts/cleanup_orphans.sh "${{ secrets.TF_STATE_BUCKET }}"

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=financial-watch/prod/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Terraform Apply
        env:
          TF_VAR_container_image: ${{ needs.build-and-push-container.outputs.image_uri }}
          TF_VAR_api_access_key: ${{ secrets.API_ACCESS_KEY }}
          TF_VAR_openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          TF_VAR_budget_alert_email: ${{ secrets.BUDGET_ALERT_EMAIL }}
          TF_VAR_desired_count: 1
        run: terraform apply -auto-approve

      - name: Run Database Snapshot Ingestion Task
        run: |
          echo "Triggering ECS migration task to initialize database and load knowledge base snapshot..."
          eval $(terraform output -raw migration_command) || true

      - name: Capture Terraform Outputs
        id: tf-outputs
        run: |
          echo "app_url=$(terraform output -raw app_url)" >> $GITHUB_OUTPUT
          echo "cloudfront_id=$(terraform output -raw cloudfront_distribution_id)" >> $GITHUB_OUTPUT
          echo "s3_bucket=$(terraform output -raw frontend_s3_bucket)" >> $GITHUB_OUTPUT
          echo "ecs_cluster=$(terraform output -raw ecs_cluster_name)" >> $GITHUB_OUTPUT
          echo "ecs_service=$(terraform output -raw ecs_service_name)" >> $GITHUB_OUTPUT
          echo "api_access_key=$(terraform output -raw api_access_key)" >> $GITHUB_OUTPUT

  deploy-frontend-and-smoke-test:
    name: Deploy Static Frontend, Invalidate CDN & Smoke Test
    needs: [terraform-apply]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Next.js Static Export
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_ACCESS_KEY: ${{ needs.terraform-apply.outputs.api_access_key }}
        run: |
          npm ci
          npm run build

      - name: Sync Static Assets to S3
        env:
          S3_BUCKET: ${{ needs.terraform-apply.outputs.s3_bucket }}
        run: |
          aws s3 sync frontend/out/ "s3://$S3_BUCKET" --delete --cache-control "public, max-age=31536000, immutable"
          # Ensure index.html and HTML error pages do not cache forever
          aws s3 cp frontend/out/index.html "s3://$S3_BUCKET/index.html" --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront CDN Cache
        env:
          DIST_ID: ${{ needs.terraform-apply.outputs.cloudfront_id }}
        run: |
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"

      - name: Automated Smoke Test Probe
        id: smoke-test
        env:
          APP_URL: ${{ needs.terraform-apply.outputs.app_url }}
          API_KEY: ${{ secrets.API_ACCESS_KEY }}
        run: |
          echo "Probing Health Check endpoint: $APP_URL/health"
          for i in {1..12}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$APP_URL/health" || true)
            if [ "$STATUS" -eq 200 ]; then
              echo "Backend is healthy (HTTP 200)!"
              break
            fi
            echo "Attempt $i: waiting for service propagation (got HTTP $STATUS)..."
            sleep 10
          done

          if [ "$STATUS" -ne 200 ]; then
            echo "Smoke test FAILED! Health endpoint did not return 200."
            exit 1
          fi

          echo "Verifying API Auth Protection..."
          UNAUTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$APP_URL/api/posts" || true)
          if [ "$UNAUTH_STATUS" -ne 401 ]; then
            echo "Security test FAILED! Unauthenticated request did not return 401."
            exit 1
          fi
          echo "Smoke test passed successfully!"

      - name: Automated Rollback on Smoke Test Failure
        if: failure() && steps.smoke-test.outcome == 'failure'
        env:
          CLUSTER: ${{ needs.terraform-apply.outputs.ecs_cluster }}
          SERVICE: ${{ needs.terraform-apply.outputs.ecs_service }}
        run: |
          echo "Rolling back ECS deployment to previous stable task definition..."
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" --force-new-deployment
