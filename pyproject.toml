[project]
name = "financial-watch"
version = "0.1.0"
description = "FinancialWatch: AI-driven misinformation and reputational risk intelligence for Nigerian financial institutions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "openai>=1.51.0",
    "httpx>=0.27.2",
    "beautifulsoup4>=4.12.3",
    "pypdf>=5.0.0",
    "pyyaml>=6.0.2",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "memory"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "backend/tests", "memory/tests"]
pythonpath = [".", "backend", "memory"]

[tool.ruff]
line-length = 100
target-version = "py311"
