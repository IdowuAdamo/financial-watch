services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: financial-watch-pgvector
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: financial_watch
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./memory/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d financial_watch"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
