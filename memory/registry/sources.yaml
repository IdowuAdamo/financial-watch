sources:
  - id: cbn
    name: "Central Bank of Nigeria (CBN)"
    base_url: "https://www.cbn.gov.ng"
    tier: 1
    access_method: "sitemap_and_direct"
    sitemap_url: "https://www.cbn.gov.ng/sitemap.xml"
    section_allowlist:
      - "/circulars/"
      - "/pressreleases/"
      - "/guidelines/"
      - "/documents/"
    disallow_rules:
      - "/footer.html"
      - "/header.html"
      - "/museum/"
      - "*.asp"
      - "/appsettings.json"
    rate_limit_seconds: 2.0
    page_cap: 30
    robots_status: "allowed_with_disallows"
    terms_of_use_note: "Public sector regulatory repository. Public circulars and directives for financial system stability."
    is_active: true

